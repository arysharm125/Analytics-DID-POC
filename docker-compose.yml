# version attribute removed as it's obsolete

services:
  app:
    build: .
    image: did-microservice:latest # Use a consistent image name
    restart: always
    env_file: .env
    # expose: # 'expose' is only for internal network, use 'ports' for host access
    #   - 8080
    ports: # *** ADD THIS SECTION ***
      - "8081:8080" # Map host port 8081 to container port 8080
    # No 'depends_on: redis' needed if Redis is external

  worker:
    build: . # Use the same image
    image: did-microservice:latest
    restart: always
    command: celery -A celery_worker.celery_app worker --loglevel=info
    env_file: .env
    # No 'depends_on: redis' needed

