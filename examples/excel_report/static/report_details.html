<!DOCTYPE html>
<html>
<head>
    <title>Report Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .did-container {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .did {
            font-family: monospace;
            word-break: break-all;
            font-size: 14px;
            color: #333;
        }
        .button {
            display: inline-block;
            background-color: #1976d2;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
        .button:hover {
            background-color: #1565c0;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Report DID Details</h1>
    <div class="did-container">
        <h3>Digital Identifier (DID)</h3>
        <p class="did">$did</p>
    </div>
    <p>This report has been registered with a DID for verification and integrity checking.</p>
    <p>If this were a real service, it could go back, fetch the report, and display it again to the user.</p>
    <a href="$did_check_url" class="button" target="_blank">
        View Full Details in DIDCheck →
    </a>
</body>
</html>
