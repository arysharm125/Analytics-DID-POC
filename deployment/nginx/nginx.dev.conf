# Nginx file for the reverse proxy that runs in front of the DIDSvc backend API
# in the DEV environment.

events {}

http {
    resolver 127.0.0.11 valid=10s;

    # Custom log format with request ID
    log_format main '$remote_addr:$remote_port - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';

    access_log /dev/stdout main;

    upstream didsvc_api {
        server didsvc-dev-api:8000;
    }

    server {
        listen 80;

        # Global security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API backend upstream.
        location / {
            # Inject request ID for distributed tracing
            proxy_set_header X-Request-ID $request_id;

            # Forward real client IP:port for accurate logging
            proxy_set_header X-Real-Client "$remote_addr:$remote_port";

            proxy_pass http://didsvc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
