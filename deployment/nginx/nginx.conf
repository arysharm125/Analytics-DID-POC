events {}

http {
    resolver 127.0.0.11 valid=10s;

    # Custom log format with request ID
    log_format main '$remote_addr:$remote_port - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';

    access_log /dev/stdout main;

    # Rate limiting zone for DIDCheck endpoints
    limit_req_zone $binary_remote_addr zone=didcheck_limit:10m rate=10r/s;

    upstream didsvc_api {
        server didsvc-api:8000;
    }

    server {
        listen 80;

        # Global security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # DIDCheck routes with enhanced security
        location /didcheck {
            # Rate limiting
            limit_req zone=didcheck_limit burst=20 nodelay;
            limit_req_status 429;

            # CORS for DIDCheck frontend
            # Note: In production, set DIDCHECK_ORIGIN env var to https://didcheck.amd.com
            add_header Access-Control-Allow-Origin "https://didcheck.amd.com" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-API-Token, Content-Type" always;

            # Handle preflight requests
            if ($request_method = OPTIONS) {
                return 204;
            }

            # Inject API token (configure DIDCHECK_API_TOKEN in nginx environment)
            # For development: use a fixed token or pass from environment
            # For production: set via docker-compose environment variable
            proxy_set_header X-API-Token "dev-token-12345";

            # Inject request ID for distributed tracing
            proxy_set_header X-Request-ID $request_id;

            # Forward real client IP:port for accurate logging
            proxy_set_header X-Real-Client "$remote_addr:$remote_port";

            proxy_pass http://didsvc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Other routes (existing behavior)
        location / {
            # Inject request ID for distributed tracing
            proxy_set_header X-Request-ID $request_id;

            # Forward real client IP:port for accurate logging
            proxy_set_header X-Real-Client "$remote_addr:$remote_port";

            proxy_pass http://didsvc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
