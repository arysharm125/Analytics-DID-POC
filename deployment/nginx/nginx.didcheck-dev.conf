# Nginx file for the server that provides access to the DIDCheck frontend SPA in
# the DEV environment.

events {}

http {
    resolver 127.0.0.11 valid=10s;

    # Load standard MIME mappings
    include /etc/nginx/mime.types;

    # Configure serving compressed files.
    gzip_static on;                         # serves .gz if exists
    add_header Vary Accept-Encoding always; # Alert caches the responses depend on Accept-Encoding header.

    # Custom log format with request ID
    log_format main '$remote_addr:$remote_port - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';

    access_log /dev/stdout main;

    # Rate limiting zone for DIDCheck endpoints
    limit_req_zone $binary_remote_addr zone=didcheck_limit:10m rate=10r/s;

    # The upstream backend API container. This is linking directly to the
    # backend container, without going through the nginx/SSL termination reverse
    # proxy container.
    upstream didsvc_api {
        server didsvc-dev-api:8000;
    }

    server {
        listen 80;

        # Global security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Backend API routes with enhanced security
        location /api/ {
            # Rate limiting
            limit_req zone=didcheck_limit burst=20 nodelay;
            limit_req_status 429;

            # Inject API token to authenticate with backend service.
            proxy_set_header X-API-Token "${DIDCHECK_ACCESS_TOKEN}"; # Set using nginx envsubst

            # Inject request ID for distributed tracing
            proxy_set_header X-Request-ID $request_id;

            # Forward real client IP:port for accurate logging
            proxy_set_header X-Real-Client "$remote_addr:$remote_port";

            proxy_pass http://didsvc_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files location.
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
