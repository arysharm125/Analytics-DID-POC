[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access,app,app.access

[handlers]
keys=console

[formatters]
keys=standard,access

[filters]
keys=request_id

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
qualname=uvicorn
propagate=0

[logger_uvicorn.error]
level=INFO
handlers=console
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=CRITICAL
handlers=console
qualname=uvicorn.access
propagate=0

[logger_app]
level=DEBUG
handlers=console
qualname=app
propagate=0

[logger_app.access]
level=INFO
handlers=console
qualname=app.access
propagate=0

[handler_console]
class=StreamHandler
formatter=standard
args=(sys.stdout,)

[formatter_standard]
format=%(asctime)s [%(request_id)s] - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access]
format=%(asctime)s [%(request_id)s] - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[filter_request_id]
class=app.request_id.RequestIdFilter
