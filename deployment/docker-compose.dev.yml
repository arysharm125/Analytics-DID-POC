version: "3.9"

networks:
  default:
    name: didsvc-dev

services:
  # =========================
  # 🔹 API SERVICE
  # =========================
  api:
    container_name: didsvc-dev-api
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file:
      - /etc/didsvc/env
    restart: always
    expose:
      - "8000"

  # =========================
  # 🔹 DIDCHECK FRONTEND
  # =========================
  didcheck:
    container_name: didsvc-dev-didcheck
    build:
      context: ..
      dockerfile: deployment/Dockerfile.didcheck
    restart: always
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.didcheck-dev.conf:/etc/nginx/templates/nginx.conf.template:ro
    env_file:
      - /etc/didsvc/env
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    expose:
      - "8090"

  # =========================
  # 🔹 PUBLIC NGINX (TLS GATEWAY)
  # =========================
  didsvc-dev-nginx:
  container_name: didsvc-dev-nginx
  image: nginx:1.29.6-alpine
  restart: always
  depends_on:
    - api
    - didcheck
  ports:
    - "443:443"
  volumes:
    - ./nginx/conf.d:/etc/nginx/conf.d:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
  networks:
    - default
