# Docker compose file for use in DEV environment (no SSL/TLS).
# Mounts the nginx reverse proxy to port 8092 and the DIDCheck SPA in port 8090.

networks:
  default:
    name: didsvc-dev

services:
  api:
    container_name: didsvc-dev-api
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file:
      - ../.env.dev
    restart: always
    expose:
      - "8000"   # private, nginx will access this

  nginx: # Reverse nginx proxy in front of backend API (didsvc.amd.com)
    image: nginx:1.25-alpine
    container_name: didsvc-dev-nginx
    restart: always
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "8092:80"


  didcheck:  # Nginx for didcheck SPA frontend (didcheck.amd.com)
    container_name: didsvc-dev-didcheck
    build:
      context: ..
      dockerfile: deployment/Dockerfile.didcheck
    restart: always
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.didcheck-dev.conf:/etc/nginx/nginx.conf.template:ro
    env_file:
      - ../.env.dev
    command: >
      /bin/sh -c "envsubst '$${DIDCHECK_ACCESS_TOKEN}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    ports:
      - "8090:80"
